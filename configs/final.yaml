# Final configuration (full protocol; NOT executed in the sandbox delivery —
# runtime would exceed the free-tier budget. Command:
#   python scripts/run_final.py --config configs/final.yaml
# The pilot config is a scaled-down version of exactly this protocol.)
run_name: final
seed_base: 20261102

env:
  H: 11
  W: 11
  braid: 0.15
  max_steps: 300
  goal: [10, 10]
  start: [0, 0]

splits:
  n_train: 18
  n_val: 6
  n_test: 6
  maze_seed_start: 1000

grid:
  methods:
    - q_learning
    - dyna_q
    - dyna_q_plus
    - prioritized_sweeping
    - dirichlet_dyna
    - local_forgetting
    - dstar_lite
    - cavr
    - cavr_nodetector
    - cavr_fixedB
  scenarios:
    static:
      rhos: [0.0, 0.1, 0.3]
    blocking:
      rhos: [0.0, 0.1, 0.3]
    shortcut:
      rhos: [0.0, 0.1, 0.3]
    oscillation:
      rhos: [0.0, 0.3]
  steps: 6000
  t_change_frac: 0.4
  second_change_frac: 0.7
  episode_seeds: 5     # 6 val mazes x 5 = 30 map/seed pairs (spec 7.1)
  save_checkpoints: true

agent:
  alpha: 0.1
  alpha_model: 0.15
  gamma: 0.97
  eps: 0.1
  beta: 0.5
  b0: 0.6
  edge_lr: 0.4
  rho_est: 0.1
  dyna_n: 20
  ps_n: 20
  ps_theta: 0.001
  lf_n: 32
  cap: 64
  theta_useful: 0.01
  theta_push: 0.05
  theta_probe: 0.12
  probe_min_gap: 8
  budget_theta_high: 0.15
  budget_theta_lo: 0.10
  drift: 0.01
  cooldown: 15
  dstar_retest_interval: 50

calibrated: {}

train:
  steps: 8000

verify:
  steps: 3000
  rho: 0.3

canonical:
  H: 6
  W: 9
  steps: 2500
  block_t: 1000
  shortcut_t: 2000
  dyna_ns: [0, 5, 20, 50]
  seeds: 5

calibration:
  val_steps: 2000
  h_grid: [3.0, 4.0, 5.0, 6.0, 8.0, 10.0]
  kappa_grid: [0.0003, 0.001, 0.003]
  target_far_per_1000: 5.0

logging:
  step_log_subset: true
